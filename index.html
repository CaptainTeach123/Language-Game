<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Word Wizard</title>
  <meta name="description" content="A bright, talking picture game that helps Anthony learn his first 50 words by listening.">

  <!-- iPhone / iPad home screen app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Word Wizard">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#38B6F5">
  <link rel="apple-touch-icon" href="img/icons/icon-180.png">
  <link rel="icon" type="image/png" href="img/icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="sky" aria-hidden="true">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="spark s1"></div>
    <div class="spark s2"></div>
    <div class="spark s3"></div>
    <div class="spark s4"></div>
    <div class="spark s5"></div>
    <div class="ground"></div>
    <div class="castle"></div>
  </div>

  <main id="app" aria-live="polite"></main>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="toast" role="status"></div>

  <noscript>
    <p style="padding:24px;font:20px sans-serif;background:#fff">Word Wizard needs JavaScript turned on.</p>
  </noscript>

  <script src="js/words.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
